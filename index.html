<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas de países · REST Countries</title>
  <meta name="description" content="Explora países del mundo consumiendo la API pública REST Countries.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Atlas de países</h1>
    <p>Busca un país, filtra por región y abre su ficha. Datos de la API pública REST Countries.</p>
  </header>

  <main>
    <section class="controls" aria-label="Filtros">
      <label>Buscar por nombre
        <input id="search" type="search" placeholder="Ej. México, Japan, Brasil" autocomplete="off">
      </label>
      <label>Región
        <select id="region">
          <option value="">Todas</option>
          <option>Africa</option><option>Americas</option><option>Asia</option>
          <option>Europe</option><option>Oceania</option><option>Antarctic</option>
        </select>
      </label>
      <label>Ordenar por
        <select id="sort">
          <option value="name">Nombre (A–Z)</option>
          <option value="pop-desc">Población (mayor a menor)</option>
          <option value="pop-asc">Población (menor a mayor)</option>
        </select>
      </label>
    </section>

    <p id="count" class="count" aria-live="polite"></p>
    <div id="status" role="status" aria-live="polite"></div>
    <ul id="grid" class="grid"></ul>
    <nav id="pager" class="pager" aria-label="Paginación"></nav>
  </main>

  <dialog id="modal" aria-labelledby="m-title">
    <div id="modal-body"></div>
    <button id="close" class="btn">Cerrar</button>
  </dialog>

  <footer>Fuente: <a href="https://restcountries.com" target="_blank" rel="noopener">restcountries.com</a></footer>
  <script src="app.js"></script>
</body>
</html>
