<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas de países y ciudades · CountriesNow</title>
  <meta name="description" content="Explora países y sus ciudades consumiendo la API pública CountriesNow.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Atlas de países y ciudades</h1>
    <p>Busca por país o por ciudad y abre la ficha de cada país. Datos de la API pública CountriesNow.</p>
  </header>

  <main>
    <section class="controls" aria-label="Filtros">
      <label>Buscar país o ciudad
        <input id="search" type="search" placeholder="Ej. Mexico, Tokyo, Lima" autocomplete="off">
      </label>
      <label>Ciudades registradas
        <select id="min">
          <option value="0">Cualquier cantidad</option>
          <option value="10">10 o más</option>
          <option value="50">50 o más</option>
          <option value="200">200 o más</option>
        </select>
      </label>
      <label>Ordenar por
        <select id="sort">
          <option value="name">Nombre (A–Z)</option>
          <option value="cities-desc">Más ciudades primero</option>
          <option value="cities-asc">Menos ciudades primero</option>
        </select>
      </label>
    </section>

    <p id="count" class="count" aria-live="polite"></p>
    <div id="status" role="status" aria-live="polite"></div>
    <ul id="grid" class="grid"></ul>
    <nav id="pager" class="pager" aria-label="Paginación"></nav>
  </main>

  <dialog id="modal" aria-labelledby="m-title">
    <div id="modal-body"></div>
    <button id="close" class="btn">Cerrar</button>
  </dialog>

  <footer>Fuente: <a href="https://countriesnow.space" target="_blank" rel="noopener">countriesnow.space</a></footer>
  <script src="app.js"></script>
</body>
</html>
